<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustración de cámara de seguridad vigilando un área">
<title>Ilustración de cámara de seguridad vigilando un área</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d2137"/><stop offset="1" stop-color="#0a1628"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0097A7" stop-opacity=".45"/><stop offset="1" stop-color="#0097A7" stop-opacity="0"/></radialGradient>
